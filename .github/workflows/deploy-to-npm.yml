name: Deploy to NPM

on:
  workflow_dispatch:
  release:
    types: [published]
# npm Trusted Publishing: GitHub proves who is publishing with a short-lived OIDC token, so there
# is no NPM_TOKEN to expire or leak. The trusted publisher is set on npmjs.com under the package's
# settings, and names this workflow file.
permissions:
  contents: read
  id-token: write
jobs:
  build-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: yarn install --immutable
      - run: yarn build
      - run: npm publish --access public
